<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הדף לא נמצא · מפת הקלפיות</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/kalpi-map/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#f7f6f2;--card:#fff;--text:#1d1d1f;--muted:#5f6368;--line:#e2e0da;--accent:#1f5fbf}
@media (prefers-color-scheme:dark){:root{--bg:#17181a;--card:#222326;--text:#ececec;--muted:#a6a8ab;--line:#3a3b3f;--accent:#7fb0ff}}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
main{max-width:460px;margin:24px;padding:28px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:center}
h1{margin:12px 0 6px;font-size:1.5rem}p{color:var(--muted);margin:0 0 18px}
form{display:flex;gap:8px}input{flex:1;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
button,a.btn{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;text-decoration:none}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="14" fill="#1f5fbf"/><circle cx="32" cy="26" r="15" fill="#fff"/><path d="M19.5 33h25L32 54z" fill="#fff"/><rect x="24" y="23.5" width="16" height="5" rx="2.5" fill="#1f5fbf"/></svg>
  <h1>הדף לא נמצא</h1>
  <p>הקישור שגוי או שהדף הוסר. אפשר לחפש כתובת ולראות את הקלפיות הקרובות אליה.</p>
  <form action="/kalpi-map/" method="get" role="search">
    <input name="q" aria-label="כתובת" placeholder="למשל: הרצל 1, תל אביב" autocomplete="street-address">
    <button type="submit">חיפוש</button>
  </form>
  <p style="margin:16px 0 0"><a href="/kalpi-map/">לעמוד הראשי</a></p>
</main>
</body>
</html>
